services:
  mcp-error-handler:
    build: .
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    ports:
      # Same PORT both sides: it's also injected into the container via env_file below,
      # so the app listens on whatever PORT is set to — the mapping has to match it, not 3000.
      - "127.0.0.1:${PORT:-3010}:${PORT:-3010}"
    env_file:
      - .env
    volumes:
      - ./config/apps:/app/config/apps:ro
      - ./github-app-private-key.pem:/app/github-app-private-key.pem:ro
      - data:/app/data

volumes:
  data: