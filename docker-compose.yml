services:
  mcp-error-handler:
    build: .
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    ports:
      - "127.0.0.1:${PORT:-3010}:3000"
    env_file:
      - .env
    volumes:
      - ./config/apps:/app/config/apps:ro
      - ./github-app-private-key.pem:/app/github-app-private-key.pem:ro
      - data:/app/data

volumes:
  data: