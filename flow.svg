<svg viewBox="0 0 1000 1750" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Any error source posts to a webhook or the MCP tool, authenticated by a shared secret. The server fingerprints the error, checks GitHub for a PR already tagged with that fingerprint as context, prepares a git worktree with dependencies installed, then runs a Claude session that decides to skip, report itself incomplete, or draft a fix. A drafted fix is tested locally, looping back into the same Claude session with the previous attempt and test output on failure, up to a retry cap. Once there is either a passing fix or the retries are exhausted, a Jira ticket is created and assigned via git blame; a passing fix additionally gets pushed as a GitHub branch named after the Jira ticket and, eventually, a pull request. Slack is notified either way.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    :root {
      --bg:#ffffff; --line:#1f2328; --text:#1f2328; --dim:#57606a;
      --accent:#2f6fed; --accent-bg:#eaf1ff;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --line:#c9d1d9; --text:#c9d1d9; --dim:#8b949e; --accent:#79b8ff; --accent-bg:#132038; }
    }
    svg { color: var(--line); }
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; }
    .accentbox { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 1.5; }
    .dashed { fill: none; stroke: var(--dim); stroke-width: 1.5; stroke-dasharray: 6 5; }
    .arrow { stroke: var(--line); stroke-width: 1.5; fill: none; }
    .diamond { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; }
    .t13 { font-size: 13px; }
    .t12 { font-size: 12px; }
    .t11 { font-size: 11px; fill: var(--dim); }
    .t10 { font-size: 10px; fill: var(--dim); }
    .mid { text-anchor: middle; }
    .grouplabel { font-size: 12px; fill: var(--dim); }
  </style>

  <rect x="0" y="0" width="1000" height="1750" fill="var(--bg)"/>

  <!-- sources -->
  <rect class="box" x="60" y="20" width="280" height="60" rx="6"/>
  <text class="t13 mid" x="200" y="46">Sentry</text>
  <text class="t11 mid" x="200" y="62">webhook</text>

  <rect class="box" x="360" y="20" width="280" height="60" rx="6"/>
  <text class="t13 mid" x="500" y="46">Other tracker (Bugsnag, …)</text>
  <text class="t11 mid" x="500" y="62">webhook</text>

  <rect class="box" x="660" y="20" width="280" height="60" rx="6"/>
  <text class="t13 mid" x="800" y="46">Developer</text>
  <text class="t11 mid" x="800" y="62">plain-text description</text>

  <path class="arrow" d="M200,80 L400,128" marker-end="url(#arrow)"/>
  <path class="arrow" d="M500,80 L500,128" marker-end="url(#arrow)"/>
  <path class="arrow" d="M800,80 L600,128" marker-end="url(#arrow)"/>

  <!-- ingestion -->
  <rect class="accentbox" x="290" y="130" width="420" height="100" rx="6"/>
  <text class="t13 mid" x="500" y="157">Ingestion</text>
  <text class="t11 mid" x="500" y="175">webhook routes + MCP tool</text>
  <text class="t11 mid" x="500" y="193">report_error(app_id, data)</text>
  <text class="t10 mid" x="500" y="211">Authorization: Bearer &lt;shared secret&gt;</text>

  <path class="arrow" d="M500,230 L500,258" marker-end="url(#arrow)"/>
  <text class="t10 mid" x="500" y="250">fingerprint = stable id or payload hash</text>

  <!-- dedup context -->
  <rect class="box" x="290" y="260" width="420" height="70" rx="6"/>
  <text class="t12 mid" x="500" y="283">Dedup check — context only</text>
  <text class="t11 mid" x="500" y="299">search GitHub PRs for the</text>
  <text class="t11 mid" x="500" y="315">fingerprint marker in body</text>

  <path class="arrow" d="M500,330 L500,358" marker-end="url(#arrow)"/>

  <!-- prepare workspace -->
  <rect class="dashed" x="270" y="360" width="460" height="200" rx="8"/>
  <text class="grouplabel" x="290" y="382">Prepare workspace</text>

  <rect class="box" x="300" y="396" width="400" height="40" rx="5"/>
  <text class="t12 mid" x="500" y="420">Clone / pull repo — GitHub App token</text>

  <rect class="box" x="300" y="444" width="400" height="40" rx="5"/>
  <text class="t12 mid" x="500" y="468">git worktree add wip/&lt;fingerprint&gt;</text>

  <rect class="box" x="300" y="492" width="400" height="54" rx="5"/>
  <text class="t12 mid" x="500" y="512">Install dependencies</text>
  <text class="t11 mid" x="500" y="528">(auto-detected, or install_cmd)</text>

  <path class="arrow" d="M500,560 L500,588" marker-end="url(#arrow)"/>

  <!-- draftFix -->
  <rect class="accentbox" x="270" y="590" width="460" height="110" rx="6"/>
  <text class="t13 mid" x="500" y="622">draftFix — Claude Agent SDK</text>
  <text class="t11 mid" x="500" y="640">pinned model, per-session $ cap</text>
  <text class="t11 mid" x="500" y="658">reads: report, existing PR,</text>
  <text class="t11 mid" x="500" y="676">Confluence docs, prior attempt</text>

  <path class="arrow" d="M500,700 L500,738" marker-end="url(#arrow)"/>

  <!-- diamond 1: skip? -->
  <polygon class="diamond" points="500,740 610,795 500,850 390,795"/>
  <text class="t12 mid" x="500" y="800">skip?</text>

  <path class="arrow" d="M390,795 L342,795" marker-end="url(#arrow)"/>
  <text class="t11" x="365" y="782">yes</text>
  <rect class="box" x="60" y="760" width="280" height="70" rx="6"/>
  <text class="t12 mid" x="200" y="788">Nothing happens</text>
  <text class="t11 mid" x="200" y="804">no ticket, no branch</text>

  <path class="arrow" d="M500,850 L500,878" marker-end="url(#arrow)"/>
  <text class="t11" x="510" y="868">no</text>

  <!-- run tests -->
  <rect class="box" x="290" y="880" width="420" height="70" rx="6"/>
  <text class="t12 mid" x="500" y="908">Run test_cmd locally</text>
  <text class="t11 mid" x="500" y="924">(skipped if AI said incomplete)</text>

  <path class="arrow" d="M500,950 L500,978" marker-end="url(#arrow)"/>

  <!-- diamond 2: tests pass? -->
  <polygon class="diamond" points="500,995 610,1050 500,1105 390,1050"/>
  <text class="t12 mid" x="500" y="1045">tests</text>
  <text class="t12 mid" x="500" y="1061">pass?</text>

  <!-- loop back to draftFix -->
  <path class="arrow" d="M610,1050 L860,1050 L860,645 L732,645" marker-end="url(#arrow)"/>
  <text class="t10" x="868" y="840">revise: prior attempt +</text>
  <text class="t10" x="868" y="856">test output fed back</text>
  <text class="t10" x="868" y="872">(≤ local_max_attempts)</text>

  <path class="arrow" d="M500,1105 L500,1158" marker-end="url(#arrow)"/>
  <text class="t10" x="515" y="1125">passed — or incomplete /</text>
  <text class="t10" x="515" y="1140">retries exhausted, no fix</text>

  <!-- create ticket -->
  <rect class="box" x="290" y="1160" width="420" height="90" rx="6"/>
  <text class="t13 mid" x="500" y="1188">Create Jira ticket</text>
  <text class="t11 mid" x="500" y="1206">assignee via git blame →</text>
  <text class="t11 mid" x="500" y="1224">email → Jira account</text>

  <path class="arrow" d="M500,1250 L500,1278" marker-end="url(#arrow)"/>

  <!-- diamond 3: has a passing fix? -->
  <polygon class="diamond" points="500,1295 610,1350 500,1405 390,1350"/>
  <text class="t12 mid" x="500" y="1345">has a</text>
  <text class="t12 mid" x="500" y="1361">passing fix?</text>

  <path class="arrow" d="M390,1350 L200,1350 L200,1398" marker-end="url(#arrow)"/>
  <text class="t11" x="230" y="1338">no</text>
  <rect class="box" x="60" y="1400" width="280" height="90" rx="6"/>
  <text class="t12 mid" x="200" y="1428">Notify Slack</text>
  <text class="t11 mid" x="200" y="1444">(ticket link)</text>
  <text class="t11 mid" x="200" y="1460">status: ticket_only</text>

  <path class="arrow" d="M610,1350 L800,1350 L800,1398" marker-end="url(#arrow)"/>
  <text class="t11" x="700" y="1338">yes</text>
  <rect class="accentbox" x="660" y="1400" width="280" height="90" rx="6"/>
  <text class="t12 mid" x="800" y="1424">Push branch as</text>
  <text class="t12 mid" x="800" y="1440">fix/&lt;jira-key&gt;</text>
  <text class="t11 mid" x="800" y="1456">Open PR — fingerprint</text>
  <text class="t11 mid" x="800" y="1472">marker in body (stub)</text>

  <path class="arrow" d="M800,1490 L800,1518" marker-end="url(#arrow)"/>
  <rect class="box" x="660" y="1520" width="280" height="80" rx="6"/>
  <text class="t12 mid" x="800" y="1544">Notify Slack</text>
  <text class="t11 mid" x="800" y="1560">(ticket + PR link)</text>
  <text class="t11 mid" x="800" y="1576">status: pr_pending_ci</text>

  <path class="arrow" d="M800,1600 L800,1628" marker-end="url(#arrow)"/>
  <rect class="dashed" x="660" y="1630" width="280" height="80" rx="6"/>
  <text class="t12 mid" x="800" y="1654">GitHub Actions CI</text>
  <text class="t11 mid" x="800" y="1670">not yet wired —</text>
  <text class="t11 mid" x="800" y="1686">handleCIResult stub</text>
</svg>
