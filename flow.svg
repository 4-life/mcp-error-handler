<svg viewBox="0 0 1960 610" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Any error source calls one report_error tool. The orchestrator reads its repo checkout plus the app's Confluence docs and drafts a fix, then runs the app's tests locally, revising up to a cap before giving up and leaving the ticket analysis-only. A locally-passing fix is pushed as a GitHub PR; GitHub Actions CI is still checked, and a CI failure sends its log back for another local revision, up to its own cap, before the PR is left for a developer either way.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    :root {
      --bg:#ffffff; --line:#1f2328; --text:#1f2328; --dim:#57606a;
      --accent:#2f6fed; --accent-bg:#eaf1ff;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --line:#c9d1d9; --text:#c9d1d9; --dim:#8b949e; --accent:#79b8ff; --accent-bg:#132038; }
    }
    svg { color: var(--line); }
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
    .box { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; }
    .accentbox { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 1.5; }
    .dashed { fill: none; stroke: var(--dim); stroke-width: 1.5; stroke-dasharray: 6 5; }
    .arrow { stroke: var(--line); stroke-width: 1.5; fill: none; }
    .arrowdash { stroke: var(--dim); stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .diamond { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; }
    .t13 { font-size: 13px; }
    .t12 { font-size: 12px; }
    .t11 { font-size: 11px; fill: var(--dim); }
    .t10 { font-size: 10px; fill: var(--dim); }
    .mid { text-anchor: middle; }
    .grouplabel { font-size: 12px; fill: var(--dim); }
  </style>

  <rect x="0" y="0" width="1960" height="610" fill="var(--bg)"/>

  <!-- sources -->
  <rect class="box" x="30" y="30" width="190" height="54" rx="6"/>
  <text class="t13 mid" x="125" y="52">Sentry</text>
  <text class="t11 mid" x="125" y="68">webhook alert</text>

  <rect class="box" x="30" y="104" width="190" height="54" rx="6"/>
  <text class="t13 mid" x="125" y="126">Bugsnag / Rollbar / …</text>
  <text class="t11 mid" x="125" y="142">webhook alert</text>

  <rect class="box" x="30" y="178" width="190" height="54" rx="6"/>
  <text class="t13 mid" x="125" y="200">Developer</text>
  <text class="t11 mid" x="125" y="216">plain-text description</text>

  <!-- confluence context source -->
  <rect class="box" x="30" y="280" width="190" height="54" rx="6"/>
  <text class="t13 mid" x="125" y="302">Confluence</text>
  <text class="t11 mid" x="125" y="318">app docs (per app_id)</text>

  <!-- front door -->
  <rect class="accentbox" x="290" y="86" width="210" height="90" rx="6"/>
  <text class="t13 mid" x="395" y="117">Ingestion</text>
  <text class="t11 mid" x="395" y="135">webhook routes / MCP tool</text>
  <text class="t11 mid" x="395" y="153">report_error(app_id, data)</text>

  <!-- source arrows -->
  <path class="arrow" d="M220,57 L288,105" marker-end="url(#arrow)"/>
  <path class="arrow" d="M220,131 L288,131" marker-end="url(#arrow)"/>
  <text class="t10 mid" x="254" y="123">raw payload</text>
  <path class="arrow" d="M220,205 L288,157" marker-end="url(#arrow)"/>

  <!-- front door -> orchestrator -->
  <path class="arrow" d="M500,131 L558,168" marker-end="url(#arrow)"/>

  <!-- confluence -> step3 -->
  <path class="arrow" d="M220,307 L588,245" marker-end="url(#arrow)"/>
  <text class="t10" x="360" y="277">context</text>

  <!-- orchestrator group -->
  <rect class="dashed" x="560" y="20" width="360" height="310" rx="8"/>
  <text class="grouplabel" x="580" y="45">Orchestrator — runs per app_id</text>

  <rect class="box" x="590" y="60" width="300" height="50" rx="5"/>
  <text class="t12 mid" x="740" y="80">1 · load app config</text>
  <text class="t10 mid" x="740" y="96">repo, Jira, Slack, Confluence, AI, test cmd</text>

  <rect class="box" x="590" y="140" width="300" height="50" rx="5"/>
  <text class="t12 mid" x="740" y="169">2 · git pull + worktree add &lt;fix-branch&gt;</text>

  <rect class="box" x="590" y="220" width="300" height="50" rx="5"/>
  <text class="t12 mid" x="740" y="240">3 · AI reads stack trace / description +</text>
  <text class="t11 mid" x="740" y="256">code + Confluence docs, drafts a fix</text>

  <path class="arrow" d="M740,110 L740,138" marker-end="url(#arrow)"/>
  <path class="arrow" d="M740,190 L740,218" marker-end="url(#arrow)"/>

  <!-- step3 -> jira -->
  <path class="arrow" d="M740,270 L740,398" marker-end="url(#arrow)"/>
  <text class="t10" x="748" y="338">creates</text>

  <!-- step3 -> local test box -->
  <path class="arrow" d="M890,235 L948,238" marker-end="url(#arrow)"/>

  <!-- jira ticket -->
  <rect class="box" x="590" y="400" width="300" height="64" rx="6"/>
  <text class="t13 mid" x="740" y="420">Jira ticket</text>
  <text class="t11 mid" x="740" y="436">root-cause analysis + assignee</text>
  <text class="t10 mid" x="740" y="450">assignee via git blame → email → Jira user</text>

  <!-- jira -> slack -->
  <path class="arrow" d="M740,464 L740,508" marker-end="url(#arrow)"/>

  <!-- slack -->
  <rect class="box" x="590" y="510" width="300" height="60" rx="6"/>
  <text class="t13 mid" x="740" y="532">Slack channel (per app)</text>
  <text class="t11 mid" x="740" y="549">posts ticket + PR link</text>

  <!-- local test box -->
  <rect class="box" x="950" y="215" width="170" height="60" rx="6"/>
  <text class="t12 mid" x="1035" y="237">4 · run tests locally</text>
  <text class="t11 mid" x="1035" y="253">(test_cmd)</text>

  <!-- local box -> local diamond -->
  <path class="arrow" d="M1120,245 L1158,245" marker-end="url(#arrow)"/>

  <!-- local diamond -->
  <polygon class="diamond" points="1230,195 1300,245 1230,295 1160,245"/>
  <text class="t12 mid" x="1230" y="240">local</text>
  <text class="t12 mid" x="1230" y="256">pass?</text>

  <!-- local diamond no -> loop back to step3 -->
  <path class="arrow" d="M1230,295 L1230,340 L860,340 L860,270" marker-end="url(#arrow)"/>
  <text class="t10" x="965" y="332">revise &amp; rerun (≤3x);</text>
  <text class="t10" x="965" y="345">after: no push, ticket only</text>

  <!-- local diamond yes -> PR -->
  <path class="arrow" d="M1300,245 L1338,245" marker-end="url(#arrow)"/>
  <text class="t11" x="1305" y="228">yes*</text>

  <!-- PR box -->
  <rect class="accentbox" x="1340" y="215" width="170" height="60" rx="6"/>
  <text class="t12 mid" x="1425" y="237">commit, push,</text>
  <text class="t12 mid" x="1425" y="253">open GitHub PR</text>

  <!-- PR -> CI diamond -->
  <path class="arrow" d="M1510,245 L1548,245" marker-end="url(#arrow)"/>
  <text class="t10" x="1517" y="233">CI runs</text>

  <!-- CI diamond -->
  <polygon class="diamond" points="1620,195 1690,245 1620,295 1550,245"/>
  <text class="t12 mid" x="1620" y="240">CI</text>
  <text class="t12 mid" x="1620" y="256">passes?</text>

  <!-- CI diamond yes -> developer -->
  <path class="arrow" d="M1690,245 L1728,245" marker-end="url(#arrow)"/>
  <text class="t11" x="1697" y="228">yes</text>

  <!-- CI diamond no -> fetch log -->
  <path class="arrow" d="M1620,295 L1620,378" marker-end="url(#arrow)"/>
  <text class="t11" x="1585" y="335">no</text>

  <!-- fetch ci log box -->
  <rect class="box" x="1510" y="380" width="220" height="54" rx="6"/>
  <text class="t12 mid" x="1620" y="402">fetch failing job log</text>
  <text class="t10 mid" x="1620" y="418">via GitHub Checks API</text>

  <!-- fetch log -> loop back to step3 for CI-driven revision -->
  <path class="arrow" d="M1510,407 L900,407 L900,250 L890,250" marker-end="url(#arrow)"/>
  <text class="t10" x="910" y="399">revise &amp; push fix</text>
  <text class="t10" x="910" y="411">(≤3 CI attempts)</text>

  <!-- fetch log -> developer, retries exhausted -->
  <path class="arrowdash" d="M1730,407 L1730,254" marker-end="url(#arrow)"/>
  <text class="t10" x="1738" y="325">after 3 failed</text>
  <text class="t10" x="1738" y="338">CI attempts: leave PR</text>
  <text class="t10" x="1738" y="351">+ comment for dev</text>

  <!-- developer box -->
  <rect class="accentbox" x="1730" y="215" width="170" height="60" rx="6"/>
  <text class="t12 mid" x="1815" y="237">Developer reviews</text>
  <text class="t12 mid" x="1815" y="253">and merges</text>

  <!-- footnote -->
  <text class="t10" x="1300" y="185">* pass, or no test_cmd configured for the app</text>
</svg>